<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Tej Prakash Carpenter</title>
    <meta name="description" content="Selected projects by Tej Prakash Carpenter — demos, source and links.">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="cursor"></div>

    <header>
        <nav id="nav" aria-label="Primary navigation">
            <a href="index.html" id="profile-btn"><button class="nav-btn box-btn">Tej</button></a>
            <a href="" id="empty-nav-box"></a>
            <a href="projects.html" id="project-btn" class="nav-active"><button
                    class="nav-btn box-btn">Projects</button></a>
            <a href="certificates.html" id="certificate-btn"><button class="nav-btn box-btn">Certificates</button></a>
            <a href="contact.html" id="project-btn"><button class="nav-btn box-btn">Contact</button></a>
            <a target="_blank" href="docs/resume.pdf" id="resume-btn"><button
                    class="nav-btn box-btn" id="resume-btn">Resume</button></a>
        </nav>
    </header>
    <div class="main" id="main">
        <div class="main-container" id="projects-container">
            <!-- Projects will be loaded dynamically -->
        </div>
    </div>
    <script>
        async function loadProjects() {
            try {
                const response = await fetch('data/projects.json');
                const data = await response.json();
                const projectsContainer = document.getElementById('projects-container');

                data.projects.forEach(project => {
                    const card = document.createElement('div');
                    card.className = 'project-card';

                    const technologies = project.technologies.join(' • ');

                    const links = [];
                    if (project.projectUrl && project.projectUrl !== '#') {
                        links.push(`<a href="${project.projectUrl}" target="_blank" rel="noopener" class="project-link">Live Demo</a>`);
                    }
                    if (project.githubUrl) {
                        links.push(`<a href="${project.githubUrl}" target="_blank" rel="noopener" class="project-link">View on GitHub</a>`);
                    }

                    card.innerHTML = `
                        <div class="upper-project-card">
                            <img src="${project.image}" alt="${project.title}" class="project-card-img" loading="lazy">
                        </div>
                        <div class="lower-project-card">
                            <h3>${project.title}</h3>
                            <p class="project-description">${project.description}</p>
                            <p class="project-tech">${technologies}</p>
                            <p class="project-links">${links.join(' ')}</p>
                        </div>
                    `;

                    projectsContainer.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading projects:', error);
            }
        }

        // Load projects when the page loads
        window.addEventListener('load', loadProjects);
    </script>

    <script src="js/script.js"></script>
</body>

</html>
